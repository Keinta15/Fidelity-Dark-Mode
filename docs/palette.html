<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fidelity Dark Mode Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* One look on purpose: a dark theme's colours, shown on the dark page they
   are made for. The light versions are content here, with their own colours. */
:root {
  color-scheme: dark;
  --bg: #0e0e0e;
  --plate: #171716;
  --plate-2: #1f1f1e;
  --fg: #f4f3f0;
  --muted: #a8a6a1;
  --faint: #6f6d69;
  --rule: #2a2a29;
  --hl: #ff4fa3;
  --ui: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 15px/1.45 var(--ui);
  padding-block: 40px 80px;
  padding-inline: max(16px, 4vw);
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1200px; margin: 0 auto; display: grid; gap: 56px; }

/* --- masthead ------------------------------------------------------------- */
.mast { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 20px; }
.eyebrow { font: 600 12px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: #5cbf4a; }
.mast h1 { margin: 10px 0 0; font: 800 clamp(34px, 5vw, 56px)/1 var(--ui); letter-spacing: -.02em; text-wrap: balance; }
.mast .sub { margin: 12px 0 0; color: var(--muted); font-size: 16px; }
.key { display: flex; align-items: center; gap: 10px; color: var(--muted); font: 500 13px/1 var(--ui); }
.key .sw { width: 64px; }
@media (max-width: 640px) { .mast { grid-template-columns: 1fr; } }

/* --- swatch pair: light half, dark half ----------------------------------- */
.sw {
  position: relative; display: grid; grid-template-columns: 1fr 1fr;
  width: 76px; height: 44px; border-radius: 10px; overflow: hidden; flex: none;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .10);
}
.sw i { display: block; background: var(--c); }
.sw::after {
  content: "→"; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px;
  margin: -8px 0 0 -8px; border-radius: 50%; display: grid; place-items: center;
  font: 700 10px/1 var(--ui); color: #fff; background: rgba(14, 14, 14, .55);
}
.sws { display: grid; gap: 3px; flex: none; }
.sw.half { height: 20px; border-radius: 7px; }
.sw.half::after { display: none; }

/* --- hero: pages of the site, both modes, a divider to drag ---------------- */
.hero-wrap { display: grid; gap: 12px; }
.stage { position: relative; }
.hero {
  position: relative; border-radius: 16px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--rule), 0 30px 60px rgba(0, 0, 0, .45);
  touch-action: pan-y; user-select: none; cursor: ew-resize;
}
.hero .lane-dark { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--split, 50%)); }
.hero .track {
  display: flex; transform: translateX(calc(var(--page, 0) * -100%));
  transition: transform .6s cubic-bezier(.22, .8, .24, 1);
}
.hero .pg { flex: 0 0 100%; min-width: 0; }
.hero .frame { container-type: inline-size; }
@media (prefers-reduced-motion: reduce) { .hero .track { transition: none; } }

/* the arrows sit across the picture's edges, half on the page behind it */
.turn {
  position: absolute; top: 50%; z-index: 3; width: 46px; height: 46px; margin-top: -23px; padding: 0;
  display: grid; place-items: center; border: 0; border-radius: 50%; cursor: pointer;
  background: #fff; color: #141414;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .14), 0 10px 28px rgba(0, 0, 0, .5);
  transition: opacity .25s, transform .15s;
}
.turn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.turn.prev { left: -23px; }
.turn.next { right: -23px; }
.turn:hover { transform: scale(1.06); }
.turn:active { transform: scale(.94); }
.turn:focus-visible { outline: 3px solid var(--hl); outline-offset: 3px; }
.turn:disabled { opacity: 0; pointer-events: none; }
/* a phone has no gutter to hang them in, so they join the page names below */
@media (max-width: 640px) {
  .turn {
    top: auto; bottom: -48px; margin-top: 0; width: 34px; height: 34px;
    background: var(--plate); color: var(--fg); box-shadow: inset 0 0 0 1px var(--rule);
  }
  .turn svg { width: 16px; height: 16px; }
  .turn.prev { left: 0; }
  .turn.next { right: 0; }
  .stage .hero .knob { width: 34px; height: 34px; margin: -17px 0 0 -17px; font-size: 13px; }
}

/* the page names, one of them lit */
/* above the picture's shadow, which would otherwise dim it */
.pager {
  position: relative; z-index: 1; justify-self: center; display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px;
  background: var(--plate); box-shadow: inset 0 0 0 1px var(--rule);
}
.pager button {
  border: 0; padding: 9px 16px; border-radius: 999px; background: transparent; color: var(--muted);
  font: 600 13px/1 var(--ui); cursor: pointer; transition: background-color .2s, color .2s;
}
.pager button:hover { color: var(--fg); }
.pager button[aria-current="page"] { background: var(--fg); color: var(--bg); }
.pager button:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }
/* on a narrow phone the names alone do it, the full width of the picture */
@media (max-width: 440px) {
  .turn { display: none; }
  .pager { justify-self: stretch; display: flex; }
  .pager button { flex: 1 1 0; min-width: 0; padding: 10px 6px; font-size: 12.5px; white-space: nowrap; }
}
.hero .bar {
  position: absolute; top: 0; bottom: 0; left: var(--split, 50%); width: 2px; margin-left: -1px;
  background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .25), 0 0 18px rgba(0, 0, 0, .5); pointer-events: none;
}
.hero .knob {
  position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
  border-radius: 50%; background: #fff; color: #222; display: grid; place-items: center;
  font: 700 16px/1 var(--ui); box-shadow: 0 4px 16px rgba(0, 0, 0, .45);
}
.hero-cap { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 600 11px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.hero-cap .mid { font: 500 12px/1 var(--ui); letter-spacing: .01em; text-transform: none; text-align: center; }
.hero input[type="range"] {
  position: absolute; inset: auto 0 0 0; width: 100%; height: 100%; margin: 0;
  opacity: 0; cursor: ew-resize;
}
.hero input[type="range"]:focus-visible ~ .bar .knob { outline: 3px solid var(--hl); outline-offset: 3px; }

/* --- jump links ------------------------------------------------------------ */
.jump { display: flex; flex-wrap: wrap; gap: 8px; }
.jump a {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; border-radius: 999px;
  background: var(--plate); color: var(--fg); text-decoration: none; font: 600 13px/1 var(--ui);
  box-shadow: inset 0 0 0 1px var(--rule);
}
.jump a:hover { background: var(--plate-2); }
.jump .dots { display: inline-flex; }
.jump .dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--plate), inset 0 0 0 1px rgba(255, 255, 255, .22); margin-left: -4px; }
.jump .dots i:first-child { margin-left: 0; }

/* --- a family -------------------------------------------------------------- */
.grp { display: grid; gap: 18px; scroll-margin-top: 24px; }
.grp h2 { margin: 0; font: 700 24px/1.1 var(--ui); letter-spacing: -.01em; }
.grp-body { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 28px; align-items: start; }
.pairs { display: grid; gap: 6px; }
.pair {
  display: flex; align-items: center; gap: 14px; width: 100%; padding: 8px 10px 8px 8px;
  border: 0; border-radius: 14px; background: transparent; color: inherit; text-align: left;
  font: inherit; cursor: pointer;
}
.pair:hover, .pair.on { background: var(--plate-2); }
.pair:focus-visible { outline: 2px solid var(--hl); outline-offset: 1px; }
.pair .tx { min-width: 0; }
.pair .nm { display: block; font: 600 14px/1.2 var(--ui); }
.pair .hx { display: block; margin-top: 3px; font: 500 12px/1.2 var(--mono); color: var(--muted); white-space: nowrap; }
.pair .hx b { font-weight: 500; color: var(--faint); }
.mocks { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-width: 0; }
.mock { margin: 0; min-width: 0; display: grid; gap: 8px; }
.mock figcaption { font: 600 11px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.mock .frame {
  container-type: inline-size; border-radius: 14px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--rule);
}
@media (max-width: 900px) {
  .grp-body { grid-template-columns: 1fr; }
  .pairs { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
}
@media (max-width: 560px) {
  .mocks { grid-template-columns: 1fr; }
  .pairs { grid-template-columns: 1fr 1fr; gap: 8px; }
  .pair { flex-direction: column; align-items: stretch; gap: 8px; padding: 8px; background: var(--plate); }
  .pair .sws, .pair .sw { width: 100%; }
  .pair .sw { height: 38px; }
  .pair .sw.half { height: 18px; }
  .pair .hx { font-size: 11px; }
}

/* --- every mapping ---------------------------------------------------------- */
.all { display: grid; gap: 22px; }
.all h2 { margin: 0; font: 700 24px/1.1 var(--ui); }
.all h3 { margin: 0 0 10px; font: 600 12px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { width: 40px; height: 24px; display: grid; grid-template-columns: 1fr 1fr; border-radius: 6px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .08); }
.chip i { background: var(--c); }
.chip:hover { box-shadow: 0 0 0 2px var(--hl); }
.peek { min-height: 20px; font: 500 13px/1.4 var(--mono); color: var(--muted); }
.foot { color: var(--faint); font-size: 13px; }
.foot code { font: 500 12px/1 var(--mono); color: var(--muted); }

/* ===========================================================================
 * The mock screens. Built in em, and the em is a share of the frame's width
 * (--w is the screen's width in em), so each one scales as a picture would.
 * Every colour comes from a role variable, set once for light and once for
 * dark from the same table the page lists.
 * ======================================================================== */
.scene {
  font-family: var(--ui); font-size: calc(100cqw / var(--w, 30)); line-height: 1.3;
  background: var(--page); color: var(--ink); position: relative; overflow: hidden;
}
.scene * { box-sizing: border-box; }
.scene.lit { outline: .2em solid var(--hl) !important; outline-offset: -.35em; border-radius: 0; }
.scene .lit { outline: .16em solid var(--hl) !important; outline-offset: .14em; border-radius: .3em; animation: pulse 1.2s ease-in-out infinite; }
.scene svg .lit, .scene .lit-svg { outline: 0 !important; filter: drop-shadow(0 0 .25em var(--hl)) drop-shadow(0 0 .1em var(--hl)); animation: none; }
@keyframes pulse { 50% { outline-color: rgba(255, 79, 163, .35); } }
@media (prefers-reduced-motion: reduce) { .scene .lit { animation: none; } }

.card { background: var(--card); border-radius: 1em; }
.row-x { display: flex; align-items: center; justify-content: space-between; gap: .8em; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 2.4em; padding: 0 1.3em;
  border-radius: 1.2em; background: var(--btn); color: var(--onFill); font-weight: 700; font-size: .85em; border: 0; }
.mk { width: 1.3em; height: 1.3em; border-radius: .35em; background: var(--btn); display: inline-block; }
.cap { color: var(--ink3); font-size: .62em; }

/* the hero's pages: one width, one height, so they turn like pages */
.s-sum, .s-posn, .s-perf { --w: 76; height: 38.5em; display: flex; flex-direction: column; }
.ico { display: inline-block; width: 1em; height: 1em; flex: none; vertical-align: middle; }
.s-top { display: flex; align-items: center; gap: 1.8em; height: 3.6em; padding: 0 1.6em; background: var(--card); border-bottom: 1px solid var(--line); }
.s-brand { display: flex; align-items: center; gap: .6em; font-weight: 800; font-size: 1.05em; }
.s-nav { display: flex; gap: 1.6em; font-size: .86em; }
.s-search { margin-left: auto; height: 2.3em; width: 15em; border-radius: 1.2em; border: 1px solid var(--ctl); display: flex; align-items: center; padding: 0 1em; color: var(--ink3); font-size: .8em; }
.s-out { font-size: .82em; color: var(--ink2); }
.s-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 17.5em minmax(0, 1fr); gap: 1.4em; padding: 1.4em 1.6em 1.6em; }
.s-rail { padding: 1.2em 1.1em; overflow: hidden; display: flex; flex-direction: column; }
.s-railx { margin-top: auto; padding-top: .8em; border-top: 1px solid var(--hair); display: grid; gap: .75em; font-size: .74em; }
.s-railx span { display: flex; align-items: center; gap: .6em; }
.s-railx .ico { width: 1.3em; height: 1.3em; }
.s-railh { display: flex; align-items: center; justify-content: space-between; }
.s-railic { display: flex; gap: .75em; }
.s-railic .ico { width: 1.15em; height: 1.15em; }
.s-rail h4 { margin: 0; font-size: 1.12em; font-weight: 600; }
.s-asof { color: var(--ink3); font-size: .66em; margin-top: .3em; }
.s-all { margin: .9em 0 .4em; padding: .8em .9em; border-radius: .7em; border: 1px solid var(--ctl); background: var(--page); font-size: .8em; font-weight: 600; }
.s-sec { font-size: .74em; font-weight: 700; padding: .9em 0 .3em; border-top: 1px solid var(--hair); margin-top: .5em; }
.s-acct { display: flex; justify-content: space-between; gap: .6em; padding: .45em 0; }
.s-acct .n { font-size: .78em; }
.s-acct .n small, .s-acct .v small { display: block; font-size: .82em; margin-top: .2em; }
.s-acct .n small { color: var(--ink3); }
.s-acct .v { text-align: right; font-size: .78em; font-weight: 600; }
.s-acct .v small { font-weight: 500; }
.g { color: var(--gain); } .r { color: var(--loss); } .z { color: var(--ink2); }
.s-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.s-main h1 { margin: .1em 0 .5em; font-size: 2.1em; font-weight: 800; letter-spacing: -.01em; }
.s-tabs { display: flex; gap: 1.6em; border-bottom: 1px solid var(--line); font-size: .86em; margin-bottom: 1.2em; }
.s-tabs span { padding: 0 0 .7em; color: var(--ink2); }
.s-tabs span.on { color: var(--ink); font-weight: 700; box-shadow: inset 0 -.22em 0 var(--btn); }
.s-cards { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1.08fr; gap: 1.2em; }
.s-bal { padding: 1.2em 1.3em; display: flex; flex-direction: column; }
.s-bal .t { font-weight: 600; }
.s-bal .big { font-size: 1.95em; font-weight: 800; margin: .25em 0 .1em; letter-spacing: -.01em; }
.s-bal .chg { font-size: .78em; }
.s-spark { display: block; width: 100%; height: 7.2em; margin: .8em 0 .4em; }
.s-bal .s-spark { flex: 1 1 7.2em; height: auto; min-height: 0; }
.s-chips { display: flex; gap: .5em; justify-content: center; font-size: .72em; font-weight: 700; }
.s-chips span { width: 2.6em; height: 2.6em; border-radius: 50%; display: grid; place-items: center; }
.s-chips span.sel { background: var(--raised); }
.s-link { display: inline-block; margin-top: .8em; color: var(--link); text-decoration: underline; font-size: .8em; }
.s-pos { overflow: hidden; display: flex; flex-direction: column; background: var(--grid); }
.gh, .gr { display: grid; grid-template-columns: 1.15fr 1fr 1.25fr 1.2fr; gap: .6em; padding: .7em 1em; font-size: .72em; align-items: center; }
.gh { background: var(--gridHead); font-weight: 700; border-bottom: 2px solid var(--lineStr); }
.gr { border-bottom: 1px solid var(--hair); }
.gr b { font-weight: 700; }
.gr .num, .gh .num { text-align: right; }
.gr.hov { background: var(--hover); }
.gr.mark { background: var(--row); }
.s-pos .foot2 { margin-top: auto; padding: 1em; display: flex; align-items: center; gap: 1em; }
.s-pos .foot2 a { color: var(--link); text-decoration: underline; font-size: .72em; }
.gr, .q-row { font-variant-numeric: tabular-nums; }

/* Positions: the grid, its toolbar, the account's group row */
.q-grid { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--grid); }
.q-bar { display: flex; align-items: center; gap: 1.1em; padding: .85em 1.1em; }
.q-view { display: inline-flex; align-items: center; justify-content: space-between; width: 11em; height: 2.4em; padding: 0 .7em 0 .9em; border: 1px solid var(--ctl); border-radius: .4em; font-size: .78em; }
.q-view .ico { width: 1.35em; height: 1.35em; }
.q-asof { margin-left: auto; font-size: .62em; color: var(--ink3); }
.q-tools { display: flex; gap: 1em; }
.q-tools .ico { width: 1.25em; height: 1.25em; }
.q-row { display: grid; grid-template-columns: 1.8fr 1fr 1.15fr 1.2fr 1.1fr .95fr .8fr; gap: .9em; padding: .55em 1.8em; font-size: .62em; line-height: 1.25; align-items: center; border-bottom: 1px solid var(--hair); }
.q-row > span { min-width: 0; }
.q-row .num { text-align: right; }
.q-row b { font-size: 1.12em; font-weight: 700; }
.q-row small { display: block; margin-top: .1em; font-size: 1em; }
.q-row > span:first-child small { font-size: .82em; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-row.hov { background: var(--hover); }
.q-row.mark { background: var(--row); }
.q-head { background: var(--gridHead); font-weight: 700; padding-block: .95em; border-bottom: 2px solid var(--lineStr); }
.q-head .sorted { text-decoration: underline; text-decoration-color: var(--btn); text-decoration-thickness: .22em; text-underline-offset: .75em; }
.q-acct { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: .7em; padding: .55em 1.1em .5em; background: var(--card); border-bottom: 1px solid var(--line); }
.q-acct b { font-size: .82em; }
.q-acct span { font-size: .7em; color: var(--ink2); }
.q-acct a { flex-basis: 100%; margin-top: .15em; font-size: .6em; color: var(--link); text-decoration: underline; }

/* Performance: the range picker, the balance and return, the chart */
.p-filter { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: .65em 1.1em; }
.p-ranges { display: flex; gap: .2em; font-size: .7em; font-weight: 700; }
.p-ranges span { min-width: 2.7em; height: 2.5em; padding: 0 .55em; border-radius: 1.25em; display: grid; place-items: center; }
.p-ranges span.on { background: var(--btn); color: var(--onFill); }
.p-goals { display: flex; align-items: center; gap: .8em; }
.p-lbl { font-size: .64em; }
.p-sel { display: inline-flex; align-items: center; justify-content: space-between; gap: 1.8em; height: 2.4em; padding: 0 .6em 0 .9em; border: 1px solid var(--ctl); border-radius: .4em; font-size: .72em; }
.p-sel .ico { width: 1.35em; height: 1.35em; }
.p-pill { display: inline-flex; align-items: center; height: 2.4em; padding: 0 1.1em; border: 1px solid var(--ctl); border-radius: 1.2em; font-size: .72em; }
.p-ic { display: flex; gap: .8em; }
.p-ic .ico { width: 1.15em; height: 1.15em; }
.p-main { flex: 1; min-height: 0; margin-top: .9em; padding: 1.1em 1.3em .8em; display: flex; flex-direction: column; gap: .7em; }
.p-head { display: grid; grid-template-columns: 43% 1fr auto; align-items: start; }
.p-t { display: flex; align-items: center; gap: .35em; font-size: .95em; font-weight: 700; }
.p-t .ico { width: .82em; height: .82em; }
.p-big { margin-top: .2em; font-size: .92em; font-weight: 600; }
.p-chg { margin-top: .25em; font-size: .64em; }
.p-ret { display: flex; align-items: center; gap: .45em; margin-top: .2em; font-size: .95em; font-weight: 700; }
.p-pen { display: inline-flex; border-bottom: .1em dotted var(--ink3); padding-bottom: .1em; }
.p-pen .ico { width: .78em; height: .78em; }
.p-all { display: inline-flex; align-items: center; gap: .55em; height: 2.4em; padding: 0 1em 0 1.25em; border: 1px solid var(--ctl); border-radius: 1.2em; font-size: .74em; font-weight: 600; }
.p-all .ico { width: 1.25em; height: 1.25em; }
.p-stats { display: grid; grid-template-columns: repeat(4, 1fr); }
.p-stats > div { display: grid; gap: .25em; padding: .1em 0 .1em 1.2em; border-left: 1px solid var(--line); }
.p-stats > div:first-child { border-left: 0; }
.p-stats span { font-size: .62em; white-space: nowrap; }
.p-stats b { font-size: .78em; font-weight: 700; }
/* the plot's own em is its label size, so its insets and its labels agree */
.p-plot { position: relative; flex: 1; min-height: 0; font-size: .58em; line-height: 1; color: var(--ink3); }
.p-plot .ya, .p-plot .yb { position: absolute; transform: translateY(-50%); white-space: nowrap; }
.p-plot .ya { left: 0; width: 4.4em; text-align: right; }
.p-plot .yb { right: 0; width: 6.4em; }
.p-plot .xa { position: absolute; bottom: .2em; transform: translateX(-50%); white-space: nowrap; }
.p-svg { position: absolute; left: 5.2em; top: .7em; width: calc(100% - 12.4em); height: calc(100% - 2.9em); overflow: visible; }
.p-line { stroke-width: .26em; }
.p-key { display: flex; flex-wrap: wrap; justify-content: center; gap: .4em 2.2em; font-size: .6em; color: var(--ink2); }
.p-key > span { display: inline-flex; align-items: center; gap: .5em; }
.p-key > .rr { display: inline-block; }
.p-key .off { color: var(--ink3); text-decoration: line-through; }
.k-line { width: 1.6em; height: .18em; border-radius: .1em; background: var(--ink); }
.k-dots { width: 1.6em; border-top: .22em dotted var(--c6); }
.k-dot { display: inline-block; width: .8em; height: .8em; margin: 0 .2em 0 .15em; border-radius: 50%; }

/* surfaces */
.s-surf { --w: 30; padding: 1.1em; display: grid; gap: .8em; }
.s-surf .hd { height: 2.8em; padding: 0 .9em; display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: .9em; }
.seg { display: flex; gap: .25em; font-size: .78em; font-weight: 700; }
.seg span { padding: .35em .7em; border-radius: .9em; color: var(--ink2); }
.seg span.sel { background: var(--raised); color: var(--ink); }
.s-surf .pair2 { display: grid; grid-template-columns: 1fr 1fr; gap: .8em; align-items: start; }
.s-surf .bal { padding: .9em; }
.s-surf .bal b { display: block; font-size: 1.35em; margin-top: .25em; }
.menu { background: var(--menu); border-radius: .7em; padding: .35em; box-shadow: 0 .5em 1.4em rgba(0, 0, 0, .28), 0 0 0 1px var(--line); font-size: .8em; }
.menu div { padding: .55em .7em; border-radius: .45em; }
.menu div.hov { background: var(--hover); }
.s-surf .grid { border-radius: .8em; overflow: hidden; background: var(--grid); }
.s-surf .grid .gh, .s-surf .grid .gr { grid-template-columns: 1fr 1fr 1fr; }

/* text */
.s-text { --w: 30; padding: 1.1em; }
.s-text .card { padding: 1.2em 1.3em; display: grid; gap: .35em; }
.s-text .t1 { font-size: 1.1em; font-weight: 700; }
.s-text .t0 { font-size: 2em; font-weight: 800; letter-spacing: -.01em; }
.s-text .t2 { color: var(--ink2); font-size: .85em; }
.s-text .t3 { color: var(--ink3); font-size: .75em; }
.s-text .td { color: var(--dis); font-size: .85em; }
.s-text .btn { justify-self: start; margin-top: .6em; }

/* lines */
.s-lines { --w: 30; padding: 1.1em; }
.s-lines .card { padding: 1em 1.1em; display: grid; gap: .9em; }
.s-lines .tbl .gh, .s-lines .tbl .gr { grid-template-columns: 1.2fr 1fr 1fr; padding: .6em .2em; background: transparent; }
.s-lines .div { height: 1px; background: var(--line); }
.s-lines .inp { height: 2.5em; border-radius: .4em; border: .12em solid var(--ctl); display: flex; align-items: center; padding: 0 .9em; color: var(--ink3); font-size: .82em; }
.s-lines .ring { justify-self: start; outline: .14em solid var(--focus); outline-offset: .2em; }

/* actions */
.s-act { --w: 30; padding: 1.1em; display: grid; gap: .9em; }
.s-act .card { padding: 1.2em 1.1em 1em; }
.s-act .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: .7em; text-align: center; }
.s-act .three .btn { width: 100%; padding: 0; }
.s-act .three .cap { display: block; margin-top: .5em; }
.s-act .b2 { background: var(--btnHov); } .s-act .b3 { background: var(--btnAct); }
.band { height: 3.6em; border-radius: .8em; background: var(--band); display: flex; align-items: center; justify-content: space-between; padding: 0 1.1em; color: #fff; }
.band b { font-size: 1.05em; font-weight: 800; letter-spacing: .01em; }
.band span { font-size: .82em; }

/* gains and losses */
.s-mkt { --w: 30; padding: 1.1em; display: grid; gap: .9em; }
.s-mkt .grid { border-radius: .8em; overflow: hidden; background: var(--grid); }
.s-mkt .grid .gh, .s-mkt .grid .gr { grid-template-columns: 1fr 1.2fr 1fr; }
.s-mkt .bars { padding: 1em 1.1em .8em; }
.s-mkt svg { display: block; width: 100%; height: 6.5em; }

/* links */
.s-links { --w: 30; padding: 1.1em; }
.s-links .card { padding: 1.2em 1.3em; display: grid; gap: .9em; }
.s-links a { color: var(--link); text-decoration: underline; font-size: .95em; justify-self: start; }
.s-links a.h { color: var(--linkHov); text-decoration-thickness: .12em; }
.s-links a.v { color: var(--visited); }
.s-links .row-x .cap { font-size: .7em; }

/* status */
.s-stat { --w: 30; padding: 1.1em; display: grid; gap: .6em; }
.al { display: grid; grid-template-columns: .35em 1.6em 1fr; gap: .8em; align-items: center; border-radius: .7em; overflow: hidden; padding-right: 1em; min-height: 3.6em; }
.al .st { align-self: stretch; }
.al .ic { width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; color: var(--onFill); font-weight: 800; font-size: .9em; }
.al b { display: block; font-size: .86em; }
.al small { display: block; color: var(--ink2); font-size: .74em; margin-top: .15em; }
.al.i { background: var(--infoBg); } .al.i .st, .al.i .ic { background: var(--info); }
.al.w { background: var(--warnBg); } .al.w .st, .al.w .ic { background: var(--warn); }
.al.e { background: var(--critBg); } .al.e .st, .al.e .ic { background: var(--crit); }
.al.s { background: var(--okBg); } .al.s .st, .al.s .ic { background: var(--ok); }

/* charts */
.s-chart { --w: 30; padding: 1.1em; }
.s-chart .card { padding: 1.2em; display: grid; grid-template-columns: 10em 1fr; gap: 1.3em; align-items: center; }
.s-chart svg { width: 10em; height: 10em; display: block; }
.s-chart ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .55em; font-size: .8em; }
.s-chart li { display: grid; grid-template-columns: .9em 1fr auto; gap: .6em; align-items: center; }
.s-chart li i { width: .9em; height: .9em; border-radius: 50%; }
.s-chart li span:last-child { color: var(--ink2); }

.groups { display: grid; gap: 64px; }
.all-grids { display: grid; gap: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <div class="eyebrow">Fidelity Dark Mode</div>
      <h1>The palette</h1>
      <p class="sub">Every light color, and the dark one it becomes.</p>
    </div>
    <div class="key"><span class="sw"><i style="--c:#FFFFFF"></i><i style="--c:#292928"></i></span><span>light to dark</span></div>
  </header>
  <section class="hero-wrap" aria-label="Pages of the site in both modes">
    <div class="hero-cap" aria-hidden="true"><span>Light</span><span class="mid">Drag across to compare</span><span>Dark</span></div>
    <div class="stage">
      <div class="hero" id="hero"></div>
      <button class="turn prev" id="prev" type="button" aria-label="Previous page"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5"/></svg></button>
      <button class="turn next" id="next" type="button" aria-label="Next page"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5L13 10l-5.5 5.5"/></svg></button>
    </div>
    <nav class="pager" id="pager" aria-label="Pages"></nav>
  </section>
  <nav class="jump" id="jump" aria-label="Color families"></nav>
  <div id="groups" class="groups"></div>
  <section class="all" id="all">
    <h2>Every mapping</h2>
    <div class="peek" id="peek" aria-live="polite">Hover or tap a chip to read it.</div>
    <div id="all-grids" class="all-grids"></div>
  </section>
  <footer class="foot">Read from <code>src/palette.js</code>, the same tables the extension uses.</footer>
</div>

<script src="../src/palette.js"></script>

  const SPARK = 'M0.0 67.9 L4.8 65.4 L9.5 65.6 L14.3 59.8 L19.0 60.9 L23.8 56.5 L28.6 58.3 L33.3 58.0 L38.1 67.1 L42.9 64.8 L47.6 66.4 L52.4 65.4 L57.1 64.0 L61.9 64.7 L66.7 62.5 L71.4 56.4 L76.2 58.4 L81.0 58.9 L85.7 50.5 L90.5 51.9 L95.2 51.4 L100.0 54.3 L104.8 57.1 L109.5 56.3 L114.3 57.6 L119.0 57.7 L123.8 65.8 L128.6 67.2 L133.3 71.6 L138.1 75.5 L142.9 78.8 L147.6 84.0 L152.4 77.8 L157.1 73.8 L161.9 67.3 L166.7 61.8 L171.4 55.8 L176.2 56.8 L181.0 51.0 L185.7 49.3 L190.5 46.5 L195.2 39.7 L200.0 38.9 L204.8 33.1 L209.5 37.4 L214.3 36.1 L219.0 37.8 L223.8 37.4 L228.6 34.2 L233.3 31.6 L238.1 28.3 L242.9 26.6 L247.6 27.2 L252.4 22.3 L257.1 21.4 L261.9 23.8 L266.7 26.7 L271.4 27.1 L276.2 14.5 L281.0 16.0 L285.7 17.3 L290.5 18.3 L295.2 8.2 L300.0 6.0';

  /* what every page of the signed-in site shares: the bar, the accounts rail,

    ['FSKAX', 'FIDELITY TOTAL MARKET INDEX FUND', 189.73, 0.41, 13.29, 0.22, 1897.43, 44.61, 6150.67, 2.67, '32.418'],

    const light = role => {

  for (const [name, tbl] of TABLES) {
    const entries = Object.entries(tbl).map(([l, d]) => [up(l), up(d)]).filter(([l, d]) => /^#[0-9A-F]{6}$/.test(l) && /^#[0-9A-F]{6}$/.test(d));
    entries.sort((a, b) => lumOf(b[0]) - lumOf(a[0]));
    const box = el('div', '', `<h3>${name} · ${entries.length}</h3>`);
    const row = el('div', 'chips');
    for (const [l, d] of entries) {
      const c = el('span', 'chip', `<i style="--c:${l}"></i><i style="--c:${d}"></i>`);
      c.title = `${l} → ${d}`;
      c.tabIndex = 0;
      const show = () => { peek.textContent = `${name}: ${l} → ${d}`; };
      c.addEventListener('pointerenter', show);
      c.addEventListener('focus', show);
      row.appendChild(c);
    }
    box.appendChild(row);
    all.appendChild(box);
  }
})();
</script>
</body>
</html>
