<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>A white main on a tinted page</title>
<!-- The app's arrangement: the page is a tint and the content a white surface
     on it. A full-width white main here is a card, not the page, and keeps the
     card colour. -->
<style>
  body { background-color: #F9F7F5; margin: 0; font: 14px Arial, sans-serif; color: #333333; }
  main { background: #FFFFFF; padding: 20px; min-height: 720px; }
</style>
</head>
<body>
  <main id="ptMain">Content</main>
</body>
</html>
